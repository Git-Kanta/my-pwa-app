<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#236b4a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="My Garden"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>My Garden | 園芸管理</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#193b2b;background:#f5f8f4}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{background:#236b4a;color:white;padding:20px 16px 16px}header h1{font-size:25px;margin:0}header small{opacity:.9}nav{display:flex;gap:6px;padding:10px;background:white;position:sticky;top:0;z-index:2;border-bottom:1px solid #ddd}button,input,select{font:inherit}button{cursor:pointer;min-height:44px;border:1px solid #b9d0c2;border-radius:10px;background:white;color:#20573e;padding:9px 12px}button.primary{background:#236b4a;color:white;border-color:#236b4a}nav button{flex:1;padding:8px 2px;font-size:14px}nav button.active{background:#236b4a;color:white}main{max-width:850px;margin:auto;padding:14px}section{display:none}section.active{display:block}.card{background:white;border:1px solid #dce7df;border-radius:14px;padding:15px;margin:10px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.muted{color:#64776c;font-size:13px}h2{font-size:19px;margin:10px 0}h3{font-size:16px;margin:6px 0}label{display:block;margin:12px 0 4px;font-weight:600}input,select{width:100%;min-height:44px;padding:9px;border:1px solid #aebfb3;border-radius:9px;background:white;font-size:16px}input[type=checkbox]{width:20px;min-height:20px;accent-color:#236b4a}input[type=file]{height:auto} .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.months{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.months label{margin:0;font-weight:400;background:#f5f8f4;padding:8px 4px;border-radius:7px;font-size:13px}.months input{vertical-align:middle}.task{border-left:5px solid #6aa87e}.tag{display:inline-block;border-radius:6px;padding:3px 6px;font-size:12px;margin:2px;background:#e7f1e9}.schedule{overflow-x:auto;background:white;border-radius:12px;border:1px solid #dce7df}table{border-collapse:collapse;min-width:600px;width:100%;font-size:12px}th,td{border:1px solid #e1e9e3;padding:8px 5px;vertical-align:top;min-width:90px}th:first-child,td:first-child{position:sticky;left:0;min-width:105px;background:#f5f8f4;z-index:1}th{background:#eaf2eb}.pill{display:block;border-left:4px solid #4c9b6b;background:#f0f7f1;padding:4px;margin:3px 0;border-radius:3px}.pill.done{opacity:.6;text-decoration:line-through}.photo{width:64px;height:64px;object-fit:cover;border-radius:9px;background:#e5eee7}.plantline{display:flex;gap:12px;align-items:center}.plantline .detail{flex:1;min-width:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.danger{color:#9b2828;border-color:#e8b4b4}.notice{background:#fff7df;border-radius:10px;padding:10px;font-size:13px}#message{min-height:18px;color:#236b4a;font-size:13px}.hidden{display:none!important}@media(min-width:600px){.months{grid-template-columns:repeat(6,1fr)}}
</style></head><body><header><h1>🌿 My Garden</h1><small>植物のお世話を、気持ちよく。</small></header><nav><button data-tab="home" class="active">今月</button><button data-tab="schedule">予定表</button><button data-tab="plants">植物</button><button data-tab="settings">データ</button></nav><main><div id="message" aria-live="polite"></div>
<section id="home" class="active"><div class="row"><h2 id="homeTitle">今月の作業</h2><span id="homeCount" class="muted"></span></div><div id="tasks"></div></section>
<section id="schedule"><div class="row"><h2>年間スケジュール</h2><div><button id="prevYear">◀</button> <b id="yearLabel"></b> <button id="nextYear">▶</button></div></div><p class="muted">植物ごとの作業月を表示します。左右にスクロールできます。</p><div class="schedule" id="scheduleTable"></div></section>
<section id="plants"><div class="row"><h2>植物の管理</h2><button class="primary" id="newPlant">＋ 植物を追加</button></div><div id="plantList"></div><div id="editor" class="card hidden"><h2 id="editorTitle">植物を追加</h2><form id="plantForm"><label for="plantName">植物名 *</label><input id="plantName" maxlength="60" required placeholder="例：バラ"><label for="plantPhoto">写真（任意）</label><input id="plantPhoto" type="file" accept="image/*"><div id="photoPreview"></div><label for="taskName">作業名</label><input id="taskName" maxlength="40" placeholder="例：剪定、追肥、水やり"><div class="row"><label for="taskMonth">予定月（複数選択可）</label><button type="button" id="addTask">＋ 作業を追加</button></div><div class="months" id="monthChecks"></div><label for="taskDay">日付指定（任意・1〜31日）</label><input id="taskDay" type="number" min="1" max="31" placeholder="空欄なら月単位"><p class="muted">日付が存在しない月は月末に予定します。</p><div id="editTasks"></div><div class="actions"><button type="submit" class="primary">植物を保存</button><button type="button" id="cancelEdit">キャンセル</button></div></form></div></section>
<section id="settings"><h2>データの管理</h2><div class="card"><h3>バックアップ</h3><p class="muted">iPhone内のデータは消える場合があります。定期的にバックアップしてください。</p><button class="primary" id="exportBtn">JSONを保存</button><label for="importFile">バックアップから復元</label><input type="file" id="importFile" accept=".json,application/json"><p class="muted">復元すると現在のデータを置き換えます。</p></div><div class="card"><h3>保存先について</h3><p>植物・作業・写真は、この端末のブラウザ内に保存されます。GitHubには送信されません。</p><p class="muted">写真は縮小して保存します。容量制限に達した場合は保存できません。</p></div></section>
</main><script>
(()=>{'use strict';const KEY='mygarden-v1';const $=id=>document.getElementById(id);const now=new Date();let year=now.getFullYear(),editing=null,photoData='',plants=[],done={};const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function notify(s){$('message').textContent=s;setTimeout(()=>{if($('message').textContent===s)$('message').textContent=''},4500)}function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'{}');plants=Array.isArray(o.plants)?o.plants:[];done=o.done&&typeof o.done==='object'?o.done:{}}catch{plants=[];done={};notify('保存データを読み込めませんでした')}}function save(){try{localStorage.setItem(KEY,JSON.stringify({plants,done}));return true}catch{alert('保存できません。写真の容量を減らすか、バックアップを確認してください。');return false}}function validDate(y,m,d){return new Date(y,m,0).getDate()<d?new Date(y,m,0).getDate():d}function taskKey(p,t,y,m){return [p.id,t.id,y,m].join(':')}function occurrences(y,m){const result=[];for(const p of plants)for(const t of p.tasks||[])if(t.months.includes(m)){const key=taskKey(p,t,y,m);result.push({p,t,key,completed:!!done[key],day:t.day?validDate(y,m,t.day):null})}return result}function renderHome(){const y=now.getFullYear(),m=now.getMonth()+1;const arr=occurrences(y,m);$('homeTitle').textContent=`${y}年${m}月の作業`;$('homeCount').textContent=`${arr.filter(a=>a.completed).length}/${arr.length} 完了`;$('tasks').innerHTML=arr.length?arr.map(a=>`<div class="card task"><div class="row"><div><b>${esc(a.p.name)}</b><div>${esc(a.t.name)} ${a.day?`<span class="tag">${m}/${a.day}</span>`:'<span class="tag">今月中</span>'}</div></div><button data-done="${esc(a.key)}" class="${a.completed?'':'primary'}">${a.completed?'↩ 未完了に戻す':'✓ 完了'}</button></div></div>`).join(''):'<div class="card">今月の予定はありません。「植物」から登録してください。</div>'}function renderSchedule(){$('yearLabel').textContent=year+'年';const m=now.getMonth()+1;let h='<table><thead><tr><th>植物</th>';for(let i=1;i<=12;i++)h+=`<th${i===m&&year===now.getFullYear()?' style="background:#d8ebdb"':''}>${i}月</th>`;h+='</tr></thead><tbody>';for(const p of plants){h+=`<tr><td><b>${esc(p.name)}</b></td>`;for(let i=1;i<=12;i++){h+='<td>';for(const t of p.tasks||[])if(t.months.includes(i)){const key=taskKey(p,t,year,i);h+=`<span class="pill ${done[key]?'done':''}">${esc(t.name)}${t.day?' '+validDate(year,i,t.day)+'日':''}</span>`}h+='</td>'}h+='</tr>'}h+='</tbody></table>';$('scheduleTable').innerHTML=plants.length?h:'<div class="card">植物を登録すると予定が表示されます。</div>'}function renderPlants(){$('plantList').innerHTML=plants.length?plants.map(p=>`<div class="card plantline">${p.photo?`<img class="photo" alt="${esc(p.name)}" src="${p.photo}">`:'<div class="photo" style="display:grid;place-items:center;font-size:30px">🌱</div>'}<div class="detail"><b>${esc(p.name)}</b><div class="muted">${(p.tasks||[]).map(t=>esc(t.name)).join('・')||'作業未登録'}</div><div class="actions"><button data-edit="${p.id}">編集</button><button class="danger" data-delete="${p.id}">削除</button></div></div></div>`).join(''):'<div class="card">まだ植物がありません。「植物を追加」から登録しましょう。</div>'}function renderAll(){renderHome();renderSchedule();renderPlants()}function showTab(tab){document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===tab));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));window.scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));$('prevYear').onclick=()=>{year--;renderSchedule()};$('nextYear').onclick=()=>{year++;renderSchedule()};$('tasks').addEventListener('click',e=>{const b=e.target.closest('[data-done]');if(!b)return;const key=b.dataset.done;const old=done[key];done[key]=!old;if(!save())done[key]=old;renderAll()});function taskRow(t){return `<div class="card"><div class="row"><b>${esc(t.name)}</b><button type="button" data-remove-task="${t.id}" class="danger">削除</button></div><div class="muted">${t.months.map(m=>m+'月').join('・')}${t.day?' / '+t.day+'日':''}</div></div>`}let tempTasks=[];function refreshTasks(){$('editTasks').innerHTML=tempTasks.map(taskRow).join('')}function openEditor(id){editing=id||null;const p=plants.find(x=>x.id===id);$('editorTitle').textContent=p?'植物を編集':'植物を追加';$('plantName').value=p?p.name:'';photoData=p?.photo||'';$('plantPhoto').value='';tempTasks=p?JSON.parse(JSON.stringify(p.tasks||[])):[];$('taskName').value='';$('taskDay').value='';document.querySelectorAll('[data-month]').forEach(c=>c.checked=false);refreshTasks();showTab('plants');$('editor').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth',block:'start'})}for(let i=1;i<=12;i++){$('monthChecks').insertAdjacentHTML('beforeend',`<label><input type="checkbox" data-month="${i}"> ${i}月</label>`)}$('newPlant').onclick=()=>openEditor(null);$('cancelEdit').onclick=()=>$('editor').classList.add('hidden');$('addTask').onclick=()=>{const name=$('taskName').value.trim();const months=[...document.querySelectorAll('[data-month]:checked')].map(c=>+c.dataset.month);const d=$('taskDay').value.trim();const day=d===''?null:Number(d);if(!name||!months.length||!(day===null||(Number.isInteger(day)&&day>=1&&day<=31))){alert('作業名・予定月を入力し、日付は1〜31で指定してください。');return}tempTasks.push({id:uid(),name,months,day});$('taskName').value='';$('taskDay').value='';document.querySelectorAll('[data-month]').forEach(c=>c.checked=false);refreshTasks()};$('editTasks').onclick=e=>{const b=e.target.closest('[data-remove-task]');if(!b)return;tempTasks=tempTasks.filter(t=>t.id!==b.dataset.removeTask);refreshTasks()};$('plantPhoto').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('画像ファイルを選んでください');return}try{const url=URL.createObjectURL(file);const img=new Image();img.src=url;await img.decode();const c=document.createElement('canvas');const scale=Math.min(1,700/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.72);URL.revokeObjectURL(url);$('photoPreview').innerHTML='<span class="muted">写真を設定しました</span>'}catch{alert('写真を読み込めませんでした')}};$('plantForm').onsubmit=e=>{e.preventDefault();const name=$('plantName').value.trim();if(!name){alert('植物名を入力してください');return}const previous=JSON.parse(JSON.stringify(plants));const p={id:editing||uid(),name,photo:photoData,tasks:tempTasks};if(editing)plants=plants.map(x=>x.id===editing?p:x);else plants.push(p);if(!save()){plants=previous;return}$('editor').classList.add('hidden');$('photoPreview').innerHTML='';renderAll();notify('保存しました')};$('plantList').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.edit){openEditor(b.dataset.edit)}else if(b.dataset.delete){const p=plants.find(x=>x.id===b.dataset.delete);if(!p||!confirm(`${p.name}を削除しますか？`))return;const old=plants;plants=plants.filter(x=>x.id!==p.id);if(!save())plants=old;renderAll()}};$('exportBtn').onclick=()=>{const data=JSON.stringify({version:1,exportedAt:new Date().toISOString(),plants,done},null,2);const a=document.createElement('a');const u=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.href=u;a.download='my-garden-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>15*1024*1024)throw Error('ファイルが大きすぎます');const o=JSON.parse(await f.text());if(!Array.isArray(o.plants)||!o.plants.every(p=>typeof p.id==='string'&&typeof p.name==='string'&&Array.isArray(p.tasks)&&p.tasks.every(t=>typeof t.id==='string'&&typeof t.name==='string'&&Array.isArray(t.months)&&t.months.every(m=>Number.isInteger(m)&&m>=1&&m<=12))))throw Error('形式が正しくありません');if(!confirm('現在のデータをバックアップで置き換えますか？'))return;const prev={plants,done};plants=o.plants;done=o.done&&typeof o.done==='object'&&!Array.isArray(o.done)?o.done:{};if(!save()){plants=prev.plants;done=prev.done;return}renderAll();notify('復元しました')}catch(err){alert('復元できません: '+err.message)}finally{e.target.value=''}};load();renderAll();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));})();
</script></body></html>
